<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>한민고등학교 동문 네트워킹</title>
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:title" content="한민 동문 네트워킹 초대장" />
  <meta property="og:description" content="같은 교정을 걸었던 우리, 이제는 각자의 자리에서 다시 만납니다" />
  <meta property="og:image" content="https://seoyoung1214.github.io/hanmin-invitation/logo.png" />
  <meta property="og:url" content="https://seoyoung1214.github.io/hanmin-invitation/" />
  <meta name="description" content="한민고등학교 동문 네트워킹 초대장 모음" />
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold-dim:    #8a7145;
      --gold-mid:    #c9a96e;
      --gold-bright: #e8cc8a;
      --gold-pale:   #f5e9c8;
      --bg-deep:     #090909;
      --bg-card:     #0e0e0e;
      --bg-surface:  #141414;
      --border-dim:  #1e1e1e;
      --border-mid:  #262620;
      --text-head:   #f2ead8;
      --text-body:   #b0a898;
      --text-muted:  #6a6258;
      --text-faint:  #4a4540;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-deep);
      color: var(--text-body);
      font-family: 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 16px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.028;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      top: -20vh;
      left: 50%;
      transform: translateX(-50%);
      width: 80vw;
      height: 60vh;
      background: radial-gradient(ellipse at center, rgba(201,169,110,0.045) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      max-width: 460px;
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-dim);
      border-radius: 1px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(201,169,110,0.06),
        0 24px 80px rgba(0,0,0,0.7),
        0 4px 20px rgba(0,0,0,0.5);
      animation: cardReveal 1.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes cardReveal {
      from { opacity: 0; transform: translateY(40px) scale(0.99); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .top-accent-thick {
      height: 2px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(201,169,110,0.3) 20%,
        rgba(201,169,110,0.6) 50%,
        rgba(201,169,110,0.3) 80%,
        transparent 100%);
    }

    .top-accent {
      height: 1px;
      background: linear-gradient(90deg,
        transparent 0%,
        var(--gold-dim) 20%,
        var(--gold-bright) 50%,
        var(--gold-dim) 80%,
        transparent 100%);
      margin-bottom: 1px;
    }

    .header {
      padding: 56px 44px 44px;
      text-align: center;
      position: relative;
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: 0; left: 44px; right: 44px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border-mid), transparent);
    }

    .emblem {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 36px;
      animation: fadeUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
    }

    .badge-logo-img {
      width: 64px;
      height: auto;
      display: block;
    }

    .school-name {
      font-size: 9.5px;
      font-weight: 400;
      letter-spacing: 0.28em;
      color: var(--gold-dim);
      text-transform: uppercase;
    }

    .eyebrow-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 18px;
      animation: fadeUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.42s both;
    }

    .eyebrow-line {
      width: 32px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-dim));
    }
    .eyebrow-line.right {
      background: linear-gradient(90deg, var(--gold-dim), transparent);
    }

    .eyebrow {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: 12px;
      letter-spacing: 0.22em;
      color: var(--gold-mid);
      text-transform: uppercase;
    }

    .title {
      font-family: 'Nanum Myeongjo', serif;
      font-weight: 400;
      font-size: 34px;
      line-height: 1.45;
      color: var(--text-head);
      margin-bottom: 22px;
      letter-spacing: 0.02em;
      animation: fadeUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.52s both;
    }

    .tagline {
      font-size: 12.5px;
      font-weight: 300;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      line-height: 2;
      animation: fadeUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.62s both;
    }

    .tagline em {
      color: var(--gold-mid);
      font-style: normal;
      font-weight: 400;
    }

    .body {
      padding: 44px 44px 52px;
    }

    .section-label {
      font-size: 9.5px;
      font-weight: 500;
      letter-spacing: 0.26em;
      color: var(--gold-dim);
      text-transform: uppercase;
      margin-bottom: 20px;
      animation: fadeUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both;
    }

    .event-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .event-item {
      display: block;
      text-decoration: none;
      border: 1px solid var(--border-dim);
      background: var(--bg-surface);
      padding: 22px 22px 20px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.25s ease, transform 0.25s ease;
      animation: fadeUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.78s both;
    }

    .event-item:nth-child(2) { animation-delay: 0.86s; }
    .event-item:nth-child(3) { animation-delay: 0.94s; }
    .event-item:nth-child(4) { animation-delay: 1.02s; }

    .event-item::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201,169,110,0.2), transparent);
    }

    .event-item::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(201,169,110,0.05) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .event-item:hover {
      border-color: rgba(201,169,110,0.4);
      transform: translateY(-2px);
    }
    .event-item:hover::after { opacity: 1; }

    .event-round {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 0.22em;
      color: var(--gold-mid);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .event-name {
      font-family: 'Nanum Myeongjo', serif;
      font-size: 19px;
      font-weight: 400;
      color: var(--text-head);
      letter-spacing: 0.02em;
      margin-bottom: 12px;
    }

    .event-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
    }

    .event-date {
      font-family: 'Cormorant Garamond', serif;
      font-size: 15px;
      font-weight: 400;
      color: var(--text-body);
      letter-spacing: 0.08em;
    }

    .event-venue {
      font-size: 11px;
      font-weight: 300;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .event-arrow {
      position: absolute;
      top: 22px;
      right: 22px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 15px;
      color: var(--gold-dim);
      transition: color 0.25s ease, transform 0.25s ease;
    }

    .event-item:hover .event-arrow {
      color: var(--gold-bright);
      transform: translateX(3px);
    }

    .footer-note {
      border-top: 1px solid var(--border-dim);
      padding: 28px 44px;
      text-align: center;
      position: relative;
    }

    .footer-note::before {
      content: '';
      position: absolute;
      top: 0; left: 44px; right: 44px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201,169,110,0.12), transparent);
    }

    .footer-text {
      font-size: 12px;
      font-weight: 300;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      line-height: 1.9;
    }

    .bottom-accent {
      height: 1px;
      background: linear-gradient(90deg,
        transparent 0%,
        var(--gold-dim) 20%,
        rgba(201,169,110,0.4) 50%,
        var(--gold-dim) 80%,
        transparent 100%);
      opacity: 0.4;
    }

    .credit {
      padding: 16px 44px;
      text-align: center;
      border-top: 1px solid #141414;
      position: relative;
    }

    .credit::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201,169,110,0.07), transparent);
    }

    .credit-text {
      font-size: 9.5px;
      font-weight: 300;
      color: #2e2b27;
      letter-spacing: 0.16em;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 420px) {
      .header { padding: 44px 28px 36px; }
      .body { padding: 36px 28px 44px; }
      .footer-note, .credit { padding-left: 28px; padding-right: 28px; }
      .title { font-size: 28px; }
    }
  </style>
</head>
<body>
<div class="card">
  <div class="top-accent-thick"></div>
  <div class="top-accent"></div>

  <div class="header">
    <div class="emblem">
      <img class="badge-logo-img" src="logo.png" alt="한민고등학교 로고"/>
      <span class="school-name">Hanmin High School</span>
    </div>

    <div class="eyebrow-wrap">
      <div class="eyebrow-line"></div>
      <span class="eyebrow">Alumni Networking</span>
      <div class="eyebrow-line right"></div>
    </div>

    <h1 class="title">한민 동문<br>네트워킹</h1>

    <p class="tagline">
      같은 교정을 걸었던 우리,<br>
      이제는 각자의 자리에서 <em>다시 만납니다</em>
    </p>
  </div>

  <div class="body">
    <p class="section-label">초대장</p>
    <div class="event-list">
      <a class="event-item" href="invitation/2nd.html">
        <p class="event-round">2nd · Vol. 2</p>
        <p class="event-name">제2회 동문 네트워킹 초대장</p>
        <div class="event-meta">
          <span class="event-date">2026. 07. 31</span>
          <span class="event-venue">서울살롱 · 신촌</span>
        </div>
        <span class="event-arrow">→</span>
      </a>
      <a class="event-item" href="invitation/1st.html">
        <p class="event-round">1st · Vol. 1</p>
        <p class="event-name">제1회 동문 네트워킹 초대장</p>
        <div class="event-meta">
          <span class="event-date">2026. 04. 24</span>
          <span class="event-venue">서울살롱 · 신촌</span>
        </div>
        <span class="event-arrow">→</span>
      </a>
    </div>
  </div>

  <div class="footer-note">
    <p class="footer-text">한민고등학교 동문 네트워킹의 초대장을<br>이곳에 차곡차곡 모아갑니다.</p>
  </div>

  <div class="bottom-accent"></div>
  <div class="credit">
    <p class="credit-text">© 2026 · Design &amp; Development by Seoyoung Kim</p>
  </div>
</div>
</body>
</html>
